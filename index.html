<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Burger Chaos : touche, tire et chatouille Gaston, le burger vivant. 160 réactions à découvrir !">
<title>Burger Chaos — Gaston, le burger vivant</title>
<style>
:root{--ink:#4a2a1a;--pop:#ff5c8a;--sun:#ffd23a;--cream:#fff8ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#ff8a5c;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
body{position:fixed;inset:0;width:100%}
#app{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:pointer}
#world{position:absolute;inset:0;will-change:transform}
#bg{position:absolute;inset:-25%;background:
 radial-gradient(circle at 20% 22%,#ffe56b 0,transparent 38%),
 radial-gradient(circle at 82% 30%,#ff5c8a 0,transparent 42%),
 radial-gradient(circle at 50% 95%,#7b5cff 0,transparent 48%),
 linear-gradient(160deg,#ff9a5a,#ff5c8a 52%,#6a5cff);animation:drift 50s linear infinite}
@keyframes drift{from{transform:rotate(0) scale(1.05)}to{transform:rotate(360deg) scale(1.05)}}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#floaters span{position:absolute;bottom:-12%;font-size:clamp(22px,5vw,44px);opacity:.35;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(360deg)}}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#svg{width:min(96vw,calc(80vh*.7692));width:min(96vw,calc(80dvh*.7692));aspect-ratio:400/520;height:auto;overflow:visible;pointer-events:auto;touch-action:none;margin-top:4vh}
#svg *{-webkit-user-select:none;user-select:none}
#fx{position:absolute;inset:0;pointer-events:none}
#bubble{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translate(-50%,-10px) scale(.6);opacity:0;pointer-events:none;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:8px 16px;font-weight:900;font-size:clamp(16px,4.4vw,26px);max-width:84vw;text-align:center;box-shadow:0 6px 0 rgba(74,42,26,.35);transition:transform .22s cubic-bezier(.3,1.6,.5,1),opacity .15s;z-index:5}
#bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s;z-index:4}
#disco{position:absolute;inset:-30%;pointer-events:none;opacity:0;transition:opacity .4s;mix-blend-mode:screen;z-index:3;background:conic-gradient(from 0deg,#ff2d92,#ffe600,#00e5ff,#7c4dff,#ff2d92);filter:blur(30px);animation:drift 3s linear infinite}
#disco.on{opacity:.45}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);z-index:10;pointer-events:none;touch-action:none}
#hud>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;border:none;background:#fff;color:var(--ink);font:900 clamp(15px,4vw,19px) "Trebuchet MS",system-ui,sans-serif;padding:10px 16px;border-radius:999px;box-shadow:0 5px 0 rgba(74,42,26,.35);cursor:pointer;touch-action:manipulation;min-height:44px}
.pill:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,42,26,.35)}
.round{width:48px;height:48px;padding:0;justify-content:center;font-size:22px;border-radius:50%}
#hud .right{display:flex;gap:10px}
#cnt b{color:var(--pop)}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;border-radius:18px;padding:10px 18px;font-weight:800;font-size:clamp(14px,3.8vw,18px);text-align:center;max-width:92vw;z-index:12;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.sec{background:linear-gradient(90deg,#7b5cff,#ff5c8a)}
#codex{position:absolute;inset:0;z-index:30;display:none;background:rgba(40,16,40,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#codex.open{display:flex}
.sheet{margin:auto;width:min(620px,100%);height:100%;max-height:900px;background:var(--cream);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 0 rgba(0,0,0,.2)}
.sh-head{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
.sh-head h2{margin:0;font-size:clamp(18px,5vw,24px);flex:1}
.sh-bar{height:12px;margin:0 16px;background:#f0dcc0;border-radius:99px;overflow:hidden}
.sh-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23a,#ff5c8a);transition:width .4s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 6px;scrollbar-width:none;touch-action:pan-x;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;background:#f0dcc0;color:var(--ink);font:800 13px "Trebuchet MS",system-ui,sans-serif;padding:8px 12px;border-radius:99px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
.list{flex:1;overflow-y:auto;padding:6px 12px 12px;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.it{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;margin:7px 0;border:2px solid #f0dcc0}
.it .ic{font-size:22px;width:30px;text-align:center;flex:none}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:15px}
.it span{display:block;font-size:13px;opacity:.85;line-height:1.3}
.it em{display:block;font-size:12px;opacity:.65;font-style:normal;margin-top:2px}
.it.found{border-color:#7ed957}
.it.lock{opacity:.7}
.it.secret.lock{background:#2c1b3a;color:#e9d9ff;border-color:#4a2f66}
.it.secret.found{border-color:#b47bff}
.rp{flex:none;border:none;background:var(--pop);color:#fff;width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;touch-action:manipulation}
.sh-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 14px;border-top:2px solid #f0dcc0;align-items:center;justify-content:space-between}
.sh-foot .pill{box-shadow:none;border:2px solid #f0dcc0;font-size:13px;min-height:38px;padding:6px 12px}
.sh-foot .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sh-foot .danger{color:#c0392b}
#intro{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(74,42,26,.55);font-size:clamp(13px,3.5vw,17px);pointer-events:none;z-index:6;transition:opacity .6s}
.reduced #bg,.reduced #floaters span{animation:none}
@media (prefers-reduced-motion:reduce){#bg,#floaters span{animation:none}}
</style>
</head>

<script>
(()=>{
'use strict';
/* ============================================================
   BURGER CHAOS — Gaston, le burger vivant
   Un seul fichier, sans dépendance. Sons générés avec WebAudio.

/* ---------- SONS (WebAudio, tout est synthétisé) ---------- */
const Snd=(()=>{
  let ac=null,master=null,nbuf=null;
  const api={on:SAVE.sound!==false};
  function init(){
    if(ac)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      ac=new AC();const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=.85;
      master.connect(comp);comp.connect(ac.destination);
      nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){ac=null}
  }
  api.unlock=()=>{init();if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}};
  const ok=()=>ac&&api.on;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function tone(f,d,o){
    o=o||{};if(!ok())return;
    const t=ac.currentTime+(o.at||0);const osc=ac.createOscillator();const g=ac.createGain();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+d*(o.glide||1));
    const v=o.v===undefined?.25:o.v;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.012,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vibRate||6;lg.gain.value=o.vib;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+.05);}
    osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+d+.05);
  }
  function noise(d,o){
    o=o||{};if(!ok())return;
    const t=ac.currentTime+(o.at||0);const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;
    const fl=ac.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);
    if(o.to)fl.frequency.exponentialRampToValueAtTime(Math.max(30,o.to),t+d);fl.Q.value=o.q||1;
    const g=ac.createGain();const v=o.v===undefined?.25:o.v;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+d+.05);
  }
  const FORM={a:[800,1250],o:[500,900],i:[310,2300],u:[340,700],e:[550,1800]};
  function vox(f,d,vw,o){
    o=o||{};if(!ok())return;
    const t=ac.currentTime+(o.at||0);const osc=ac.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.linearRampToValueAtTime(o.to,t+d);
    const g=ac.createGain();const v=o.v===undefined?1:o.v;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);
    g.gain.setValueAtTime(v,t+Math.max(.03,d-.06));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    (FORM[vw]||FORM.a).forEach((ff,i)=>{const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=ff;b.Q.value=i?6:4;const gg=ac.createGain();gg.gain.value=i?.7:1.2;osc.connect(b);b.connect(gg);gg.connect(g);});
    g.connect(master);osc.start(t);osc.stop(t+d+.05);
  }
  const SFX={
    boing:(p=1)=>tone(170*p,.6,{to:440*p,glide:.35,vib:40,vibRate:16,v:.4}),
    pop:(p=1)=>{tone(900*p,.09,{to:180*p,v:.4});noise(.04,{f:3000,v:.2})},
    squeak:(p=1)=>{tone(1400*p,.1,{to:2300*p,type:'triangle',v:.25});tone(1900*p,.09,{to:1300*p,type:'triangle',v:.2,at:.11})},
    splat:()=>{noise(.22,{f:900,to:200,q:.7,v:.5});tone(180,.18,{to:50,v:.4})},
    whoosh:(p=1)=>noise(.45,{f:300*p,to:2800*p,q:.8,v:.35}),
    zap:()=>{tone(1800,.28,{to:80,type:'square',v:.15});noise(.2,{f:5000,type:'highpass',v:.15})},
    up:(p=1)=>tone(350*p,.5,{to:1700*p,v:.3}),
    down:(p=1)=>tone(1500*p,.55,{to:200*p,v:.3}),
    stretch:()=>tone(110,.7,{type:'sawtooth',to:440,v:.14,vib:12,vibRate:9}),
    snap:()=>{noise(.06,{f:4000,type:'highpass',v:.4});tone(900,.12,{to:90,v:.3})},
    clap:()=>{noise(.08,{f:1500,q:.8,v:.5});noise(.1,{f:2200,q:.8,v:.3,at:.02})},
    laugh:(n=4,p=1)=>{for(let i=0;i<n;i++)vox((270+rnd(0,40))*p-i*8,.11,i%2?'o':'a',{at:i*.15})},
    giggle:(n=5)=>{for(let i=0;i<n;i++)vox(620+rnd(0,140),.07,'i',{at:i*.09,v:.8})},
    gasp:()=>{noise(.3,{f:1200,to:3000,q:.6,v:.35});vox(500,.25,'a',{to:700,at:.05,v:.6})},
    yawn:()=>vox(330,1.2,'a',{to:150}),
    snore:()=>{for(let i=0;i<2;i++){noise(.5,{f:180,q:2,v:.35,at:i*1.1});tone(70,.5,{type:'sawtooth',v:.12,at:i*1.1})}},
    honk:(p=1)=>{tone(233*p,.3,{type:'sawtooth',v:.2});tone(349*p,.3,{type:'sawtooth',v:.14})},
    chime:()=>[72,76,79,84].forEach((m,i)=>tone(mf(m),.35,{at:i*.08,v:.18})),
    magic:()=>{for(let i=0;i<7;i++)tone(1000+i*230+rnd(0,80),.18,{at:i*.06,v:.13})},
    coin:()=>{tone(988,.07,{type:'square',v:.14});tone(1319,.35,{type:'square',v:.14,at:.07})},
    sad:()=>{[311,294,277].forEach((f,i)=>tone(f,.38,{type:'sawtooth',v:.14,at:i*.4,vib:6,vibRate:5}));tone(262,.9,{type:'sawtooth',to:200,v:.14,at:1.2,vib:8,vibRate:6})},
    kick:(at=0)=>tone(160,.3,{to:40,v:.75,at}),
    snare:(at=0)=>{noise(.18,{f:1800,q:.5,v:.4,at});tone(200,.1,{to:120,type:'triangle',v:.3,at})},
    hat:(at=0)=>noise(.05,{f:7500,type:'highpass',v:.18,at}),
    bass:(m=36,at=0)=>tone(mf(m),.25,{type:'sawtooth',v:.22,at}),
    buzz:()=>tone(95,.5,{type:'square',v:.15,vib:10,vibRate:40}),
    ding:(p=1)=>{tone(1568*p,.7,{v:.22});tone(3136*p,.5,{v:.07})},
    gong:()=>{[110,164,233,271].forEach(f=>tone(f,2,{v:.18}));noise(.5,{f:300,v:.2})},
    pouet:()=>{tone(130,.25,{type:'sawtooth',to:70,vib:20,vibRate:30,v:.3});noise(.15,{f:500,v:.2})},
    drip:()=>tone(1200,.1,{to:500,v:.2}),
    hiss:()=>noise(.9,{f:6000,type:'highpass',q:.5,v:.18}),
    sizzle:()=>noise(.9,{f:5500,type:'highpass',q:.5,v:.14}),
    crunch:()=>{for(let i=0;i<3;i++)noise(.06,{f:2500,q:.7,v:.4,at:i*.08})},
    kiss:()=>{noise(.05,{f:3000,v:.2});tone(1000,.12,{to:500,v:.2,at:.04})},
    ooh:()=>vox(300,.8,'u',{to:380}),
    aah:()=>vox(380,.9,'a'),
    mmm:()=>vox(200,.7,'u'),
    hmm:()=>{vox(180,.35,'o',{to:230});vox(230,.35,'o',{to:200,at:.4})},
    grr:()=>{vox(90,.6,'o');noise(.5,{f:300,v:.2})},
    burp:()=>{tone(80,.35,{type:'sawtooth',to:50,vib:35,vibRate:55,v:.4});noise(.3,{f:200,v:.25})},
    brr:()=>tone(200,.5,{type:'sawtooth',to:150,v:.18,vib:100,vibRate:30}),
    tick:()=>tone(1200,.04,{type:'square',v:.18}),
    tock:()=>tone(800,.05,{type:'square',v:.18}),
    stomp:()=>{tone(90,.2,{to:40,v:.6});noise(.1,{f:200,v:.4})},
    tada:()=>{[60,64,67,72].forEach((m,i)=>tone(mf(m+12),.22,{type:'sawtooth',v:.12,at:i*.1}));tone(mf(84),.8,{type:'sawtooth',v:.12,at:.4});noise(.4,{f:3000,type:'highpass',v:.1,at:.4})},
    party:()=>{tone(700,.6,{to:1900,type:'square',v:.08});noise(.3,{f:2500,to:5000,v:.25,at:.4})},
    hic:()=>tone(500,.08,{to:900,type:'triangle',v:.3}),
    sniff:()=>{noise(.12,{f:3500,to:5000,v:.2});noise(.12,{f:3500,to:5200,v:.2,at:.16})},
    slurp:()=>{tone(300,.3,{to:900,v:.25});tone(900,.2,{to:200,v:.25,at:.3})},
    wow:()=>vox(300,.6,'o',{to:700}),
    glass:()=>{for(let i=0;i<8;i++)tone(2400+rnd(0,2500),.2,{v:.08,at:i*.025,type:'triangle'})},
    robot:()=>{for(let i=0;i<6;i++)tone(rnd(200,900),.07,{type:'square',v:.1,at:i*.08})}
  };
  api.play=(n,...a)=>{if(!ok())return;try{SFX[n]&&SFX[n](...a)}catch(e){}};
  api.seq=(notes,bpm,o)=>{o=o||{};const beat=60/(bpm||120);let t=0;if(ok())for(const [m,b] of notes){if(m>0)tone(mf(m),b*beat*.92,{type:o.type||'square',v:o.v===undefined?.15:o.v,at:(o.at||0)+t});t+=b*beat;}let tt=0;for(const n of notes)tt+=n[1];return tt*beat*1000;};
  api.vseq=(notes,bpm,vw,o)=>{o=o||{};const beat=60/(bpm||120);let t=0;if(ok())for(const [m,b] of notes){if(m>0)vox(mf(m),b*beat*.9,vw||'a',{at:t,v:o.v||.9});t+=b*beat;}let tt=0;for(const n of notes)tt+=n[1];return tt*beat*1000;};
  api.beat=(pat,bpm)=>{const step=60/(bpm||110)/2;if(ok())[...pat].forEach((ch,i)=>{const at=i*step;if(ch==='k')SFX.kick(at);else if(ch==='s')SFX.snare(at);else if(ch==='h')SFX.hat(at);else if(ch==='b')SFX.bass(36,at);});return pat.length*step*1000;};
  return api;
})();

const FX=(()=>{
  const cv=$('#fx'),g=cv.getContext('2d');let W=0,H=0,dpr=1;const P=[];
  function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(dpr,0,0,dpr,0,0);}
  resize();addEventListener('resize',resize);
  const COL=['#ff5c8a','#ffd23a','#5cf2c0','#6aa7ff','#b47bff','#ff9a3a','#ffffff'];
  const cnt=n=>RED()?Math.max(1,Math.ceil(n*.4)):n;
  function add(o){const lim=RED()?150:380;if(P.length>lim)P.shift();P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,life:1,age:0,rot:0,vr:0,size:10,fric:1,col:'#fff',kind:'rect',grow:0,ch:'',text:''},o));}
  const api={
    confetti(x,y,n=40,sp=1){n=cnt(n);for(let i=0;i<n;i++)add({kind:'rect',x,y,vx:rnd(-380,380)*sp,vy:rnd(-760,-150)*sp,g:900,size:rnd(7,13),rot:rnd(0,6),vr:rnd(-12,12),life:rnd(1.2,2.3),col:pickOf(COL),fric:.992});},
    burst(x,y,col,n=12,sp=1){n=cnt(n);for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(80,380)*sp;add({kind:'circle',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,g:700,size:rnd(4,9),life:rnd(.6,1.3),col,fric:.99});}},
    drops(x,y,col,n=14,sp=1){n=cnt(n);for(let i=0;i<n;i++)add({kind:'circle',x:x+rnd(-30,30),y:y+rnd(-10,10),vx:rnd(-260,260)*sp,vy:rnd(-520,-60)*sp,g:1100,size:rnd(5,12),life:rnd(.7,1.4),col});},
    stars(x,y,n=10){n=cnt(n);for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(100,360);add({kind:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:200,size:rnd(10,22),rot:rnd(0,6),vr:rnd(-6,6),life:rnd(.7,1.3),col:pickOf(['#ffd23a','#fff','#ffe98a'])});}},
    emoji(ch,x,y,n=6,o){o=o||{};n=cnt(n);for(let i=0;i<n;i++)add({kind:'emoji',ch,x:x+rnd(-24,24),y:y+rnd(-24,24),vx:rnd(-160,160)*(o.sp||1),vy:rnd(-300,-60)*(o.sp||1)+(o.vy||0),g:o.g===undefined?300:o.g,size:rnd(24,40)*(o.s||1),life:rnd(1,1.9),vr:rnd(-3,3)});},
    rain(ch,n=20,o){o=o||{};n=cnt(n);for(let i=0;i<n;i++)add({kind:'emoji',ch,x:rnd(0,W),y:rnd(-H*.9,-20),vx:rnd(-40,40),vy:rnd(60,220),g:o.g===undefined?160:o.g,size:rnd(24,46),life:rnd(2.4,3.8),vr:rnd(-2,2)});},
    ring(x,y,col,size=20){add({kind:'ring',x,y,size,grow:rnd(140,200),col,life:.5});},
    smoke(x,y,n=8){n=cnt(n);for(let i=0;i<n;i++)add({kind:'smoke',x:x+rnd(-20,20),y,vx:rnd(-40,40),vy:rnd(-140,-60),size:rnd(14,26),grow:rnd(30,60),life:rnd(.8,1.5),col:'#ffffff'});},
    pop(text,x,y,col){add({kind:'text',text,x,y,vy:-70,size:clamp(W*.07,26,48),col:col||'#fff',life:.9,rot:rnd(-.18,.18)});},
    slash(x1,y1,x2,y2){add({kind:'slash',x:x1,y:y1,vx:x2,vy:y2,life:.35,col:'#fff'});},
    update(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.age+=dt;if(p.age>=p.life){P.splice(i,1);continue;}p.vy+=p.g*dt;p.vx*=p.fric;p.vy*=p.fric;if(p.kind!=='slash'){p.x+=p.vx*dt;p.y+=p.vy*dt;}p.rot+=p.vr*dt;}},
    draw(){
      g.clearRect(0,0,W,H);
      for(const p of P){
        const q=p.age/p.life;const a=q>.65?1-(q-.65)/.35:1;g.globalAlpha=Math.max(0,a);
        if(p.kind==='rect'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);g.restore();}
        else if(p.kind==='circle'){g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.size,0,6.283);g.fill();}
        else if(p.kind==='smoke'){g.fillStyle=p.col;g.globalAlpha=Math.max(0,a*.5);g.beginPath();g.arc(p.x,p.y,p.size+p.grow*p.age,0,6.283);g.fill();}
        else if(p.kind==='star'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.beginPath();for(let i=0;i<10;i++){const r=i%2?p.size*.45:p.size;const an=i*Math.PI/5-Math.PI/2;g.lineTo(Math.cos(an)*r,Math.sin(an)*r);}g.closePath();g.fill();g.restore();}
        else if(p.kind==='emoji'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.font=Math.round(p.size)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(p.ch,0,0);g.restore();}
        else if(p.kind==='ring'){g.strokeStyle=p.col;g.lineWidth=Math.max(1,5*(1-q));g.beginPath();g.arc(p.x,p.y,p.size+p.grow*p.age,0,6.283);g.stroke();}
        else if(p.kind==='text'){g.save();g.translate(p.x,p.y);g.rotate(p.rot);const sc=q<.15?.5+q/.15*.7:1.2-(q-.15)*.2;g.scale(sc,sc);g.font='900 '+Math.round(p.size)+'px "Trebuchet MS",system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=8;g.strokeStyle='#4a2a1a';g.strokeText(p.text,0,0);g.fillStyle=p.col;g.fillText(p.text,0,0);g.restore();}
        else if(p.kind==='slash'){g.strokeStyle='#fff';g.lineWidth=8*(1-q);g.lineCap='round';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+(p.vx-p.x)*Math.min(1,q*4),p.y+(p.vy-p.y)*Math.min(1,q*4));g.stroke();}
      }
      g.globalAlpha=1;
    }
  };
  return api;
})();

function sPt(x,y){const m=svg.getScreenCTM&&svg.getScreenCTM();if(!m)return{x:innerWidth/2,y:innerHeight/2};return{x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f};}
function toSvg(cx,cy){const m=svg.getScreenCTM&&svg.getScreenCTM();if(!m)return{x:200,y:260};const i=m.inverse();return{x:i.a*cx+i.c*cy+i.e,y:i.b*cx+i.d*cy+i.f};}
const scaleU=()=>{const m=svg.getScreenCTM&&svg.getScreenCTM();return(m&&m.a>0)?m.a:1;};
const at=n=>{const c=CEN[n]||CEN.root;return sPt(c[0],c[1]);};

function hold(p,props,ms,sp){
  const s=SP[p];if(!s)return;const t=nowMs(),m=MOT();
  for(const a in props){if(!(a in REST))continue;s.t[a]=REST[a]+(props[a]-REST[a])*m;s.u[a]=t+ms;}
  if(sp){s.spk=sp.k;s.spc=sp.c;s.spU=t+ms;}
}
function kick(p,props){const s=SP[p];if(!s)return;const m=MOT();for(const a in props)if(a in REST)s.w[a]+=props[a]*m;}
function snap(p,props){const s=SP[p];if(!s)return;for(const a in props)if(a in REST){s.v[a]=props[a];s.w[a]=0;}}
function pin(p,props){const s=SP[p];if(!s)return;for(const a in props)if(a in REST){s.t[a]=props[a];s.u[a]=Infinity;}}
function unpin(p){const s=SP[p];if(!s)return;const t=nowMs();for(const a of AX)if(s.u[a]===Infinity)s.u[a]=t;}
function setSpr(p,k,c,ms){const s=SP[p];if(!s)return;s.spk=k;s.spc=c;s.spU=nowMs()+ms;}

function step(dt,now){
  const h=dt/2;
  for(const n in SP){
    const s=SP[n];const ov=now<s.spU;const k=ov?s.spk:s.k,c=ov?s.spc:s.c;
    for(const a of AX){
      if(s.u[a]!==0&&now>s.u[a]){s.t[a]=REST[a];s.u[a]=0;}
      let v=s.v[a],w=s.w[a];const t=s.t[a];
      for(let i=0;i<2;i++){w+=(k*(t-v)-c*w)*h;v+=w*h;}
      if(w>6000)w=6000;else if(w<-6000)w=-6000;
      if(Math.abs(v-t)<.0008&&Math.abs(w)<.01){v=t;w=0;}
      s.v[a]=v;s.w[a]=w;
    }
  }
}

const BRs={l:0,r:0,y:0};
function compose(s,t){
  const v=s.v;let sx=v.sx,sy=v.sy,x=v.x,y=v.y,r=v.r;
  if(s.n==='root'){const b=Math.sin(t*.0022);const amp=EX.asleep&&nowMs()<EX.asleep.u?2.2:1;sy*=1+.011*b*amp;sx*=1-.006*b*amp;}
  else if(s.n==='browL'){r+=BRs.l;y+=BRs.y;}
  else if(s.n==='browR'){r+=BRs.r;y+=BRs.y;}
  return 'translate('+x.toFixed(2)+' '+y.toFixed(2)+') translate('+s.px+' '+s.py+') rotate('+r.toFixed(2)+') scale('+sx.toFixed(3)+' '+sy.toFixed(3)+') translate('+(-s.px)+' '+(-s.py)+')';
}
function render(t){
  const now=nowMs();
  // brows
  const bp=BROW[E('brow')]||BROW.none;BRs.l+=(bp[0]-BRs.l)*.3;BRs.r+=(bp[1]-BRs.r)*.3;BRs.y+=(bp[2]-BRs.y)*.3;
  for(const n in SP){const s=SP[n];const str=compose(s,t);if(str!==s.last){s.last=str;s.el.setAttribute('transform',str);}}
  // bouche
  const mk=E('mouth');if(RS.mouth!==mk){RS.mouth=mk;const m=MOUTH[mk]||MOUTH.smile;R.mouthPath.setAttribute('d',m.d);R.mouthPath.setAttribute('fill',m.fill||'none');if(m.e){R.mouthExtra.setAttribute('d',m.e);R.mouthExtra.setAttribute('display','inline');}else R.mouthExtra.setAttribute('display','none');}
  const tg=E('tongue');if(RS.tongue!==tg){RS.tongue=tg;if(tg>0){R.tongue.setAttribute('display','inline');R.tongue.setAttribute('transform','translate(0 8) scale(1 '+tg+') translate(0 -8)');}else R.tongue.setAttribute('display','none');}
  // yeux
  LK.x+=(LKT.x-LK.x)*.25;LK.y+=(LKT.y-LK.y)*.25;
  const pm=E('pupils'),ps=E('pscale');
  for(const s of ['L','R']){
    const e=R.eye[s];let mode=E('eye'+s)||E('eyes');if(E('lids')>.5&&mode==='normal')mode='closed';
    if(RS['m'+s]!==mode){RS['m'+s]=mode;e.open.setAttribute('display',mode==='normal'?'inline':'none');for(const k of ['closed','happy','spiral','heart','x','text'])e[k].setAttribute('display',mode===k?'inline':'none');}
    const cx=s==='L'?150:250;let px=0,py=0;
    if(pm==='cross'){px=s==='L'?10:-10;}
    else if(pm==='left')px=-10;else if(pm==='right')px=10;else if(pm==='up')py=-10;else if(pm==='down')py=10;
    else if(pm==='roll'){px=Math.cos(t*.012)*9;py=Math.sin(t*.012)*9;}
    else if(pm==='crazy'){px=Math.cos(t*.02+(s==='L'?0:2))*10;py=Math.sin(t*.027+(s==='L'?1:3))*10;}
    else{const dx=LK.x-cx,dy=LK.y-165;const d=Math.hypot(dx,dy)||1;const m=Math.min(d/9,9);px=dx/d*m;py=dy/d*m;}
    const pt='translate('+px.toFixed(1)+' '+py.toFixed(1)+') scale('+ps+')';if(RS['pt'+s]!==pt){RS['pt'+s]=pt;e.pup.setAttribute('transform',pt);}
    if(mode==='spiral')e.spiral.setAttribute('transform','rotate('+((t*.45)%360).toFixed(0)+')');
    else if(mode==='heart')e.heart.setAttribute('transform','scale('+(1+.12*Math.sin(t*.02)).toFixed(2)+')');
    else if(mode==='text'){const tx=E('eyeText');if(RS.tx!==tx){RS.tx=tx;e.text.textContent=tx;}}
  }
  // divers
  const bl=E('blush');if(RS.bl!==bl){RS.bl=bl;R.blushL.setAttribute('opacity',bl);R.blushR.setAttribute('opacity',bl);}
  show(R.nosered,E('nose')==='red','nr');show(R.tearL,E('tear')>0,'tl');show(R.tearR,E('tear')>0,'tr');show(R.sweat,E('sweat')>0,'sw');show(R.vein,E('vein')>0,'vn');
  show(R.holes,E('holes')>0,'ho');show(R.face,!(E('hideFace')>0),'face');
  for(const a of ACCS)show(R['acc_'+a],E(a)>0,'a'+a);
  const dc=E('disco')>0;if(RS.dc!==dc){RS.dc=dc;R.disco.classList.toggle('on',dc);}
  const tn=E('tint');if(RS.tint!==tn){RS.tint=tn;if(tn==='gold')R.burger.setAttribute('filter','url(#fGold)');else if(tn==='rage')R.burger.setAttribute('filter','url(#fRage)');else if(tn==='ice')R.burger.setAttribute('filter','url(#fIce)');else if(tn==='rainbow')R.burger.setAttribute('filter','url(#fRainbow)');else R.burger.removeAttribute('filter');R.burger.style.opacity=tn==='ghost'?.45:'';}
  if(tn==='rainbow')R.hue.setAttribute('values',String(Math.round((t*.18)%360)));
  // ombre
  const ry=SP.root.v.y;const sc=clamp(1+ry/520,.35,1.2);const sh='translate(200 510) scale('+sc.toFixed(3)+' 1) translate(-200 -510)';if(RS.sh!==sh){RS.sh=sh;R.shadow.setAttribute('transform',sh);}
}

const S={gen:0,asleep:false,idleStage:0,lastTouch:nowMs(),hinted:false,taps:[],fl:{},corners:[],lastCombo:0,b10:0,b25:0,last:null,shake:{a:0,u:0},nextBlink:nowMs()+2500,cur:null};
const world=$('#world'),flashEl=$('#flash'),bubble=$('#bubble');
let bubbleTm=null;
function say(txt,ms){bubble.textContent=txt;bubble.classList.add('show');clearTimeout(bubbleTm);bubbleTm=setTimeout(()=>bubble.classList.remove('show'),ms||1500);}
function flash(col,ms){flashEl.style.transition='none';flashEl.style.background=col;flashEl.style.opacity=RED()?.15:.5;void flashEl.offsetWidth;flashEl.style.transition='opacity '+((ms||300)/1000+.25)+'s';flashEl.style.opacity=0;}

function makeCtx(gen,arg){
  const c={arg:arg||{},gen};
  const dead=()=>gen!==S.gen;
  c.dead=dead;
  c.w=ms=>new Promise((res,rej)=>setTimeout(()=>dead()?rej(CANCEL):res(),ms));
  c.h=(p,pr,ms,sp)=>hold(p,pr,ms,sp);
  c.hs=(ps,pr,ms,sp)=>ps.forEach(p=>hold(p,pr,ms,sp));
  c.k=(p,pr)=>kick(p,pr);
  c.ks=(ps,pr)=>ps.forEach(p=>kick(p,pr));
  c.sn=(p,pr)=>snap(p,pr);
  c.spr=(p,k,cc,ms)=>setSpr(p,k,cc,ms);
  c.f=(o,ms)=>expr(o,ms);
  c.acc=(n,ms)=>expr({[n]:1},ms);
  c.s=(n,...a)=>Snd.play(n,...a);
  c.say=say;
  c.fx=FX;
  c.at=at;
  c.pop=(t,col,part)=>{const p=at(part||'bunTop');FX.pop(t,p.x,p.y-30,col);};
  c.shake=(a,ms)=>{if(!RED())S.shake={a,u:nowMs()+ms};};
  c.flash=flash;
  c.tint=(n,ms)=>expr({tint:n},ms);
  c.disco=ms=>{if(!RED())expr({disco:1},ms);};
  c.wide=ms=>{c.hs(EYES,{sx:1.3,sy:1.3},ms);expr({pscale:.5,brow:'up'},ms);};
  c.rep=async(n,gap,fn)=>{for(let i=0;i<n;i++){fn(i);await c.w(gap);}};
  c.fly=(p,pr,ms)=>{hold(p,pr,ms,{k:7,c:3.2});S.fl[p]=nowMs()+ms+300;setTimeout(()=>setSpr(p,40,9,1100),ms);};
  c.tw=(p,prop,to,ms,ease)=>new Promise((res,rej)=>{
    const s=SP[p];const from=s.v[prop];const t0=nowMs();const ez=ease||easeIO;
    const tick=()=>{if(dead())return rej(CANCEL);const q=Math.min(1,(nowMs()-t0)/ms);const val=from+(to-from)*ez(q);s.v[prop]=val;s.w[prop]=0;s.t[prop]=val;s.u[prop]=nowMs()+200;if(q<1)requestAnimationFrame(tick);else res();};
    requestAnimationFrame(tick);
  });
  c.spin3d=(p,turns,ms,axis,face)=>new Promise((res,rej)=>{
    const s=SP[p];const t0=nowMs();axis=axis||'sx';
    const tick=()=>{if(dead())return rej(CANCEL);const q=Math.min(1,(nowMs()-t0)/ms);const a=turns*Math.PI*2*easeIO(q);const cs=Math.cos(a);
      s.v[axis]=cs;s.w[axis]=0;s.t[axis]=cs;s.u[axis]=nowMs()+200;
      if(face!==false)EX.hideFace={v:cs<0?1:0,u:nowMs()+120};
      if(q<1)requestAnimationFrame(tick);else{delete EX.hideFace;res();}};
    requestAnimationFrame(tick);
  });
  c.ghost=(n)=>{
    const gl=$('#ghosts');
    for(let i=0;i<(n||3);i++){
      const wrap=document.createElementNS('http://www.w3.org/2000/svg','g');wrap.setAttribute('pointer-events','none');
      const cl=R.burger.cloneNode(true);cl.removeAttribute('id');wrap.appendChild(cl);
      wrap.style.opacity=String(.4-i*.08);wrap.style.transformOrigin='200px 300px';wrap.style.transition='transform .9s ease-out, opacity .9s';
      gl.appendChild(wrap);
      const dx=(i+1)*46*(i%2?1:-1);
      requestAnimationFrame(()=>{wrap.style.transform='translate('+dx+'px,'+(-18*(i+1))+'px) scale('+(1+.08*(i+1))+')';wrap.style.opacity='0';});
      setTimeout(()=>{try{wrap.remove()}catch(e){}},1000);
    }
  };
  return c;
}

/* ---------- vérification interne des effectifs ---------- */
const EXPECT={touch:25,pull:20,face:20,phys:20,ingr:20,music:15,gest:15,secret:15,combo:10};
for(const k in EXPECT)if(CNT[k]!==EXPECT[k])console.warn('Catégorie',k,':',CNT[k],'au lieu de',EXPECT[k]);

/* ---------- index de déclenchement ---------- */
const POOL={};
for(const r of LIB){
  if(r.cat==='touch'||r.cat==='ingr'||r.cat==='face'){(POOL[r.part]=POOL[r.part]||[]).push(r);}
  else if(r.cat==='music'&&r.parts){for(const p of r.parts)(POOL[p]=POOL[p]||[]).push(r);}
}
const PHYSL=LIB.filter(r=>r.cat==='phys'),MUSL=LIB.filter(r=>r.cat==='music'),PULLS=LIB.filter(r=>r.cat==='pull');
const GST={},SEC={},CMB={};
for(const r of LIB){if(r.cat==='gest')GST[r.key]=r;if(r.cat==='secret')SEC[r.key]=r;if(r.cat==='combo')CMB[r.key]=r;}
const found=r=>!!SAVE.found[r.id];
function pick(list){
  if(!list||!list.length)return null;
  let cand=list.filter(r=>r!==S.last);if(!cand.length)cand=list;
  const nu=cand.filter(r=>!found(r));
  return (nu.length&&Math.random()<.8)?pickOf(nu):pickOf(cand);
}

/* ---------- lancer une réaction ---------- */
function play(r,arg){
  if(!r)return Promise.resolve();
  const gen=++S.gen;const c=makeCtx(gen,arg);S.last=r;S.cur=r;
  discover(r);
  return Promise.resolve().then(()=>r.run(c)).catch(e=>{if(e!==CANCEL)console.error('Réaction',r.id,e);});
}
function discover(r){
  if(SAVE.found[r.id])return;
  SAVE.found[r.id]=Date.now();save();updateCount();toast(r);
  if(r.secret){Snd.play('magic');}
  if(Object.keys(SAVE.found).length>=LIB.length)setTimeout(finale,1800);
}
function finale(){
  say('Tu as tout découvert ! Gaston est comblé 🍔💛',4000);Snd.play('tada');
  for(let i=0;i<5;i++)setTimeout(()=>FX.confetti(rnd(100,innerWidth-100),innerHeight*.5,60,1.3),i*350);
}

/* ---------- entrées : Pointer Events ---------- */
const app=$('#app');
const GROUP={bunTop:'top',seed:'top',eyeL:'face',eyeR:'face',nose:'face',mouth:'face',cheekL:'face',cheekR:'face',brow:'face',lettuce:'ingr',tomato:'ingr',cheese:'ingr',patty:'ingr',bunBottom:'low',armL:'low',armR:'low',legL:'low',legR:'low',bg:'bg'};
const LAYER={bunTop:'bunTop',seed:'bunTop',eyeL:'bunTop',eyeR:'bunTop',nose:'bunTop',mouth:'bunTop',cheekL:'bunTop',cheekR:'bunTop',brow:'bunTop',lettuce:'lettuce',tomato:'tomato',cheese:'cheese',patty:'patty',bunBottom:'bunBottom',armL:'armL',armR:'armR',legL:'legL',legR:'legR',bg:'bg'};
const PERFECT=['bunTop','lettuce','tomato','cheese','patty','bunBottom'];
const REVERSED=PERFECT.slice().reverse();
const PAIRS=[['eyeL','eyeR','eyes'],['bunTop','bunBottom','sandwich'],['lettuce','cheese','swap'],['tomato','patty','tango'],['armL','armR','hug'],['legL','legR','legs'],['mouth','nose','clown'],['cheekL','cheekR','hamster']];
const G=new Map();
const partOf=e=>{const t=e.target;const el=t&&t.closest?t.closest('[data-part]'):null;return el?el.getAttribute('data-part'):'bg';};
const pinPart=p=>({seed:'bunTop',brow:'bunTop'}[p]||p);
function touch(){S.lastTouch=nowMs();S.hinted=true;if(S.idleStage>0&&!S.asleep)S.idleStage=0;}
function look(e){const p=toSvg(e.clientX,e.clientY);LKT.x=p.x;LKT.y=p.y;}

function press(g){const p=pinPart(g.part);if(SP[p]&&p!=='root'){g.pressed=p;pin(p,{sx:1.05,sy:.93});}}
function unpress(g){if(g.pressed){unpin(g.pressed);g.pressed=null;}}

app.addEventListener('pointerdown',e=>{
  e.preventDefault();Snd.unlock();
  try{app.setPointerCapture(e.pointerId)}catch(_){}
  touch();look(e);
  if(S.asleep){S.asleep=false;S.idleStage=0;S.taps.length=0;play(SEC.jump);G.set(e.pointerId,{dead:true});return;}
  const part=partOf(e);
  const g={id:e.pointerId,part,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:nowMs(),drag:false,long:false,fired:false,pull:false,pins:[],samples:[],rev:0,revT:[],lastEx:e.clientX,dir:0,ang:0,prevA:null,pressed:null,tm:null,tm2:null};
  G.set(e.pointerId,g);press(g);
  g.tm=setTimeout(()=>holdFire(g),600);
  g.tm2=setTimeout(()=>holdLong(g),2700);
},{passive:false});

app.addEventListener('pointermove',e=>{
  look(e);
  const g=G.get(e.pointerId);if(!g||g.dead)return;
  const t=nowMs();const dx=e.clientX-g.x0,dy=e.clientY-g.y0;const d=Math.hypot(dx,dy);
  g.samples.push([t,e.clientX,e.clientY]);while(g.samples.length&&t-g.samples[0][0]>900)g.samples.shift();
  g.x=e.clientX;g.y=e.clientY;
  if(!g.drag&&d>14){g.drag=true;clearTimeout(g.tm);clearTimeout(g.tm2);unpress(g);g.pull=g.part!=='bg';}
  if(!g.drag)return;
  dragMove(g,e);
  if(!g.fired)detectShake(g,e,t);
  if(!g.fired)detectCircle(g,t);
},{passive:false});

function dragMove(g,e){
  const a=toSvg(e.clientX,e.clientY),b=toSvg(g.x0,g.y0);const X=a.x-b.x,Y=a.y-b.y;g.X=X;g.Y=Y;
  if(g.part==='bg'){pin('root',{x:clamp(X*.12,-26,26),r:clamp(X*.03,-6,6)});g.pins=['root'];return;}
  const p=pinPart(g.part);const s=SP[p];if(!s)return;
  const lim=(v,m)=>clamp(v,-m,m);let pr;
  if(p==='armL'||p==='armR'){
    const vx=a.x-s.px,vy=a.y-s.py;const ang=Math.atan2(-vx,vy)*180/Math.PI;pr={r:ang,sy:clamp(Math.hypot(vx,vy)/55,.8,3.2)};
  }else if(p==='legL'||p==='legR'){pr={y:lim(Y*.7,110),x:lim(X*.5,60),r:lim(X*.3,35),sy:1+Math.max(0,Y)/220};}
  else if(p==='eyeL'||p==='eyeR'||p==='mouth'||p==='nose'||p==='cheekL'||p==='cheekR'){pr={x:lim(X*.6,70),y:lim(Y*.6,70),sx:1+Math.abs(X)/90,sy:1+Math.abs(Y)/90};}
  else if(p==='bunTop'){pr={x:lim(X*.8,150),y:lim(Y*.8,170),r:lim(X*.06,18),sx:1+Math.abs(X)/420,sy:1+Math.abs(Y)/320};}
  else if(p==='lettuce'){pr={x:lim(X*.8,170),y:lim(Y*.7,150),sx:1+Math.abs(X)/150,sy:1};}
  else{pr={x:lim(X*.8,160),y:lim(Y*.8,150),sx:1+Math.abs(X)/260,sy:1+Math.abs(Y)/200};}
  pin(p,pr);g.pins=[p];
  if(p!=='root')pin('root',{r:clamp(X*.02,-5,5)});
  if(!g.pins.includes('root'))g.pins.push('root');
}
function detectShake(g,e,t){
  const x=e.clientX;if(g.dir===0){g.dir=Math.sign(x-g.lastEx)||0;g.lastEx=x;return;}
  const dd=Math.sign(x-g.lastEx);
  if(dd!==0&&dd!==g.dir){if(Math.abs(g.lastEx-(g.extX===undefined?g.lastEx:g.extX))>26||true){}
    // changement de sens : on valide si l'amplitude depuis le dernier extremum est suffisante
    if(Math.abs(g.lastEx-(g.extX===undefined?g.x0:g.extX))>30){g.revT.push(t);g.extX=g.lastEx;g.revT=g.revT.filter(q=>t-q<1300);if(g.revT.length>=5){g.fired=true;shakeFire(g);return;}}
    g.dir=dd;
  }
  if((g.dir>0&&x>g.lastEx)||(g.dir<0&&x<g.lastEx)||g.dir===0)g.lastEx=x;
}
function shakeFire(g){cleanPins(g);unpress(g);play(GST.shake);}
function detectCircle(g,t){
  const s=g.samples;if(s.length<6)return;
  let cx=0,cy=0;for(const q of s){cx+=q[1];cy+=q[2];}cx/=s.length;cy/=s.length;
  const r=Math.hypot(g.x-cx,g.y-cy);if(r<18){g.prevA=null;return;}
  const a=Math.atan2(g.y-cy,g.x-cx);
  if(g.prevA!==null){let da=a-g.prevA;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;g.ang+=da;}
  g.prevA=a;
  if(Math.abs(g.ang)>7){g.fired=true;cleanPins(g);unpress(g);play(GST.circle);}
}
function cleanPins(g){for(const p of g.pins)unpin(p);g.pins=[];}

function holdFire(g){
  if(!G.has(g.id)||g.drag||g.dead)return;
  g.long=true;unpress(g);S.taps.length=0;
  const grp=GROUP[g.part]||'bg';play(GST['hold_'+grp]);
}
function holdLong(g){
  if(!G.has(g.id)||g.drag||g.dead)return;
  if(g.part==='nose')play(SEC.sneeze);else if(g.part==='bunBottom')play(SEC.earthquake);
}

function endPtr(e){
  const g=G.get(e.pointerId);if(!g)return;G.delete(e.pointerId);
  Snd.unlock();
  if(g.dead)return;
  clearTimeout(g.tm);clearTimeout(g.tm2);unpress(g);
  try{app.releasePointerCapture(e.pointerId)}catch(_){}
  const dx=g.x-g.x0,dy=g.y-g.y0,d=Math.hypot(dx,dy);const dt=nowMs()-g.t0;
  cleanPins(g);
  if(e.type==='pointercancel')return;
  if(g.drag){
    if(g.fired)return;
    if(d>150&&dt<300){ // balayage rapide
      play(Math.abs(dx)>=Math.abs(dy)?GST.swipe_h:GST.swipe_v);return;}
    if(d<40){onTap(g);return;}
    if(g.part!=='bg')pullRelease(g,dx,dy,d);
    else if(d>80)play(pick(PHYSL),{dir:dx>0?1:-1});
    return;
  }
  if(!g.long&&e.type==='pointerup')onTap(g);
}
app.addEventListener('pointerup',endPtr);
app.addEventListener('pointercancel',endPtr);
app.addEventListener('lostpointercapture',e=>{const g=G.get(e.pointerId);if(g&&!g.drag&&!g.long){/* ignoré : pointerup suit */}});

function pullRelease(g,dx,dy,d){
  const key=(g.part==='eyeL'||g.part==='eyeR')?'eye':pinPart(g.part);
  const dir=Math.abs(dy)>Math.abs(dx)?(dy<0?'up':'down'):'side';
  const cands=PULLS.filter(r=>r.part===key);
  let r=cands.find(x=>x.dir===dir)||cands.find(x=>x.dir==='vert'&&dir!=='side')||cands.find(x=>x.dir==='any');
  if(!r){ // pas de réaction dédiée : petite réponse élastique, non comptée
    Snd.play('boing',1.2);const p=pinPart(g.part);if(SP[p])kick(p,{y:-500,sy:-3});return;}
  play(r,{dx,dy,dist:d,part:g.part});
}

/* ---------- taps : secrets, combos, doubles-taps, rares ---------- */
const CORN=(x,y)=>{const W=innerWidth,H=innerHeight;const l=x<W*.22,r=x>W*.78,t=y<H*.22,b=y>H*.78;if(t&&l)return'tl';if(t&&r)return'tr';if(b&&r)return'br';if(b&&l)return'bl';return null;};
function checkSeq(t){
  const h=[];for(let i=S.taps.length-1;i>=0&&h.length<6;i--){const a=S.taps[i];const ly=LAYER[a.part];if(h.length&&h[h.length-1].ly===ly){h[h.length-1].t=a.t;continue;}
    if(h.length&&h[h.length-1].t-a.t>2600)break;h.push({ly,t:a.t});}
  const seq=h.map(x=>x.ly).reverse();
  if(seq.length===6){if(seq.every((v,i)=>v===PERFECT[i]))return SEC.perfect;if(seq.every((v,i)=>v===REVERSED[i]))return SEC.reversed;}
  const L=S.taps.slice(-4);
  if(L.length===4&&t-L[0].t<4000&&L.every((a,i)=>a.part===(i%2?'legR':'legL'))&&L.every((a,i)=>i===0||a.t-L[i-1].t<1300))return SEC.moonwalk;
  return null;
}
function checkCombo(part,t){
  if(t-S.lastCombo<1300)return null;
  const prev=S.taps[S.taps.length-2];if(!prev||part==='bg'||prev.part==='bg'||t-prev.t>900)return null;
  const a=prev.part,b=part;
  for(const [p,q,k] of PAIRS)if((a===p&&b===q)||(a===q&&b===p))return CMB[k];
  const eye=x=>x==='eyeL'||x==='eyeR';
  if((eye(a)&&b==='mouth')||(a==='mouth'&&eye(b)))return CMB.party;
  const l3=S.taps.slice(-3);
  if(l3.length===3&&t-l3[0].t<1500){const s=new Set(l3.map(x=>x.part));if(s.size===3&&!s.has('bg'))return CMB.magic;}
  return null;
}
function onTap(g){
  const t=nowMs(),part=g.part;
  S.taps.push({t,part,x:g.x,y:g.y});S.taps=S.taps.filter(a=>t-a.t<12000);
  FX.ring(g.x,g.y,'rgba(255,255,255,.8)',10);
  // ingrédient en plein vol
  if(part!=='bg'&&S.fl[part]&&t<S.fl[part]){delete S.fl[part];play(SEC.catch,{part});return;}
  const sq=checkSeq(t);if(sq){S.taps.length=0;play(sq);return;}
  if(part==='bg'){
    const c=CORN(g.x,g.y);
    if(c){S.corners=S.corners.filter(q=>t-q.t<10000);if(!S.corners.some(q=>q.c===c))S.corners.push({c,t});if(S.corners.length>=4){S.corners=[];play(SEC.corners);return;}}
  }
  const recent=S.taps.filter(a=>t-a.t<6000).length;
  if(recent<4){S.b10=0;S.b25=0;}
  if(recent>=25&&!S.b25){S.b25=1;S.b10=1;play(SEC.explosion);return;}
  if(recent>=10&&!S.b10){S.b10=1;play(GST.lose);return;}
  const cb=checkCombo(part,t);if(cb){S.lastCombo=t;play(cb);return;}
  const prev=S.taps[S.taps.length-2];
  if(prev&&t-prev.t<330&&GROUP[prev.part]===GROUP[part]&&Math.hypot(prev.x-g.x,prev.y-g.y)<70){play(GST['dbl_'+GROUP[part]]);return;}
  if(part!=='bg'){
    const roll=Math.random();
    if(roll<.02){play(SEC.gold);return;}
    if(roll<.035){play(SEC.rainbow);return;}
    if(roll<.05){play(SEC.minis);return;}
  }
  if(part==='bg'){const cx=at('root').x;play(pick(PHYSL),{dir:g.x>cx?1:-1,x:g.x,y:g.y});return;}
  const pl=POOL[part];if(pl&&pl.length)play(pick(pl),{part,x:g.x,y:g.y});
}

addEventListener('keydown',e=>{if(e.key==='Escape')closeCodex();});
['gesturestart','gesturechange','contextmenu','dragstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));

/* ---------- direction d’orchestre : clignements, sommeil, indices ---------- */
function director(ts){
  const now=nowMs();
  if(S.shake.u>now&&!RED()){const a=S.shake.a*(S.shake.u-now)/400>S.shake.a?S.shake.a:S.shake.a;world.style.transform='translate('+rnd(-a,a).toFixed(1)+'px,'+rnd(-a,a).toFixed(1)+'px)';S.shaking=true;}
  else if(S.shaking){world.style.transform='';S.shaking=false;}
  if(ts>S.nextBlink){S.nextBlink=ts+rnd(2200,5200);if(!S.asleep)expr({lids:1},110);}
  if(document.hidden){S.lastTouch=now;return;}
  const idle=(now-S.lastTouch)/1000;
  if(!S.hinted&&idle>8&&S.idleStage===0&&!codexOpen){S.hinted=true;say('Touche-moi !',1800);}
  if(codexOpen){S.lastTouch=now;return;}
  if(S.idleStage===0&&idle>16){S.idleStage=1;S.asleep=true;play(SEC.sleep);}
  else if(S.idleStage===1&&idle>28){S.idleStage=2;play(SEC.dream);}
  else if(S.idleStage===2&&idle>40){S.idleStage=3;play(SEC.dance);}
}
document.addEventListener('visibilitychange',()=>{S.lastTouch=nowMs();});

/* ---------- interface : compteur, toast, carnet ---------- */
const CATS=[['all','Tout','⭐'],['touch','Toucher','👆'],['pull','Étirer','🧲'],['face','Visage','🤪'],['phys','Physique','🏀'],['ingr','Ingrédients','🧀'],['music','Musique','🎵'],['gest','Gestes','✋'],['secret','Secrets','🔮'],['combo','Combos','⚡']];
const CATNAME={};CATS.forEach(c=>CATNAME[c[0]]=c[1]);
const LABEL={bunTop:'le pain du dessus',seed:'une graine de sésame',bunBottom:'le pain du dessous',lettuce:'la salade',tomato:'la tomate',cheese:'le fromage',patty:'le steak',armL:'le bras gauche',armR:'le bras droit',legL:'la jambe gauche',legR:'la jambe droite',eyeL:'l’œil gauche',eyeR:'l’œil droit',mouth:'la bouche',nose:'le nez',cheekL:'la joue gauche',cheekR:'la joue droite',brow:'les sourcils',eye:'un œil'};
const DIRTXT={up:' vers le haut',down:' vers le bas',side:' sur le côté',vert:' vers le haut ou le bas',any:''};
const GHOW={dbl_top:'Touche deux fois de suite le pain du dessus',dbl_face:'Touche deux fois de suite le visage',dbl_ingr:'Touche deux fois la même garniture',dbl_low:'Touche deux fois le pain du bas, un bras ou une jambe',dbl_bg:'Touche deux fois de suite le fond',hold_top:'Maintiens le doigt sur le pain du dessus',hold_face:'Maintiens le doigt sur le visage',hold_ingr:'Maintiens le doigt sur une garniture',hold_low:'Maintiens le doigt sur le pain du bas, un bras ou une jambe',hold_bg:'Maintiens le doigt sur le fond',swipe_h:'Balaie très vite l’écran à l’horizontale',swipe_v:'Balaie très vite l’écran à la verticale',shake:'Secoue vite ton doigt de gauche à droite',circle:'Dessine des cercles avec ton doigt',lose:'Tapote le burger dix fois, vite'};
const CHOW={eyes:'Touche les deux yeux, l’un après l’autre, très vite',sandwich:'Touche le pain du haut puis celui du bas',swap:'Touche la salade puis le fromage',tango:'Touche la tomate puis le steak',hug:'Touche les deux bras',legs:'Touche les deux jambes',clown:'Touche la bouche puis le nez',hamster:'Touche les deux joues',party:'Touche un œil puis la bouche',magic:'Touche trois parties différentes en moins de 1,5 s'};
function howOf(r){
  if(r.cat==='touch'||r.cat==='ingr'||r.cat==='face')return 'Touche '+LABEL[r.part];
  if(r.cat==='pull')return 'Tire '+LABEL[r.part]+DIRTXT[r.dir];
  if(r.cat==='phys')return 'Touche le fond d’écran, autour du burger';
  if(r.cat==='music')return 'Appuie sur 🎵'+(r.parts?' (ou touche '+r.parts.map(p=>LABEL[p]).join(' / ')+')':'');
  if(r.cat==='gest')return GHOW[r.key];
  if(r.cat==='combo')return CHOW[r.key];
  return '';
}
function updateCount(){
  const n=Object.keys(SAVE.found).filter(id=>LIB.some(r=>r.id===id)).length;
  $('#cntN').textContent=n;$('#cntT').textContent=LIB.length;
  const bar=$('#cxBar');if(bar)bar.style.width=(n/LIB.length*100)+'%';
  return n;
}
let toastTm=null;
function toast(r){
  const el=$('#toast');const n=updateCount();
  el.className='';el.classList.add('show');if(r.secret)el.classList.add('sec');
  el.textContent=(r.secret?'🔮 Secret découvert : ':'✨ Nouveau : ')+r.name+'  ('+n+' / '+LIB.length+')';
  clearTimeout(toastTm);toastTm=setTimeout(()=>el.classList.remove('show'),2600);
  if(navigator.vibrate){try{navigator.vibrate(r.secret?[30,40,30]:15)}catch(e){}}
}
let codexOpen=false,codexTab='all';
function renderCodex(){
  const n=updateCount();
  const tabs=$('#cxTabs');tabs.innerHTML='';
  for(const [k,name,ic] of CATS){
    const list=k==='all'?LIB:LIB.filter(r=>r.cat===k);const got=list.filter(found).length;
    const b=document.createElement('button');b.className='tab'+(k===codexTab?' on':'');b.textContent=ic+' '+name+' '+got+'/'+list.length;
    b.addEventListener('click',()=>{codexTab=k;renderCodex();});tabs.appendChild(b);
  }
  const list=$('#cxList');list.innerHTML='';
  const items=codexTab==='all'?LIB:LIB.filter(r=>r.cat===codexTab);
  for(const r of items){
    const f=found(r);const d=document.createElement('div');
    d.className='it '+(f?'found':'lock')+(r.secret?' secret':'');
    let ic=f?'✅':(r.secret?'❓':'🔒'),name,desc,extra;
    if(f){name=r.name;desc=r.desc;extra='Découverte · '+CATNAME[r.cat];}
    else if(r.secret){name='??? (secret)';desc='Réaction secrète à découvrir.';extra='Indice : '+r.hint;}
    else{name=r.name;desc='Pas encore découverte.';extra='Comment ? '+howOf(r)+' · '+CATNAME[r.cat];}
    d.innerHTML='<div class="ic">'+ic+'</div><div class="tx"><b></b><span></span><em></em></div>';
    d.querySelector('b').textContent=name;d.querySelector('span').textContent=desc;d.querySelector('em').textContent=extra;
    if(f){const bt=document.createElement('button');bt.className='rp';bt.textContent='▶';bt.setAttribute('aria-label','Rejouer');bt.addEventListener('click',()=>{closeCodex();setTimeout(()=>{touch();play(r,{part:r.part||'bunTop',dx:0,dy:0,dir:1});},250);});d.appendChild(bt);}
    list.appendChild(d);
  }
  $('#optSound').textContent=(Snd.on?'🔊':'🔇')+' Son : '+(Snd.on?'oui':'non');
  $('#optSound').classList.toggle('on',Snd.on);
  $('#optMotion').classList.toggle('on',RED());
  $('#optMotion').textContent='🐢 Animations réduites : '+(RED()?'oui':'non');
}
function openCodex(){codexOpen=true;$('#codex').classList.add('open');renderCodex();}
function closeCodex(){codexOpen=false;$('#codex').classList.remove('open');}
function applySound(){const b=$('#btnSound');b.textContent=Snd.on?'🔊':'🔇';b.setAttribute('aria-pressed',String(Snd.on));}
function applyMotion(){document.body.classList.toggle('reduced',RED());}
function toggleSound(){Snd.on=!Snd.on;SAVE.sound=Snd.on;save();applySound();if(Snd.on){Snd.unlock();Snd.play('pop');}if(codexOpen)renderCodex();}

function setupUI(){
  $('#cnt').addEventListener('click',openCodex);
  $('#cxClose').addEventListener('click',closeCodex);
  $('#codex').addEventListener('click',e=>{if(e.target.id==='codex')closeCodex();});
  $('#btnSound').addEventListener('click',toggleSound);
  $('#optSound').addEventListener('click',toggleSound);
  $('#optMotion').addEventListener('click',()=>{SAVE.reduced=!RED();save();applyMotion();renderCodex();});
  $('#optReset').addEventListener('click',()=>{if(confirm('Effacer toute ta progression ?')){SAVE.found={};save();renderCodex();updateCount();}});
  $('#btnMusic').addEventListener('click',()=>{Snd.unlock();touch();play(pick(MUSL),{});});
  const fl=$('#floaters');const em=['🍟','🥤','🍅','🥬','🧀','🍔','🌭','🍕'];
  for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=(i*8.5+Math.random()*4)+'%';s.style.animationDuration=(14+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';fl.appendChild(s);}
  applySound();applyMotion();updateCount();
  setTimeout(()=>{const i=$('#intro');if(i)i.style.opacity=0;},7000);
}

/* ---------- boucle principale ---------- */
let lastTs=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||.016);lastTs=ts;
  step(dt,ts);render(ts);FX.update(dt);FX.draw();director(ts);
  requestAnimationFrame(loop);
}
function boot(){
  setupUI();render(0);
  setTimeout(()=>say('Touche-moi, tire-moi, secoue-moi !',3200),500);
  requestAnimationFrame(loop);
}
if(window.__TEST){window.__G={LIB,CNT,EXPECT,makeCtx,S,play,POOL,SAVE,GST,SEC,CMB,PHYSL,MUSL,PULLS,howOf,AX,SP};}
else boot();
})();
